<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>

  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="komponen.css">
  <link rel="stylesheet" href="tema.css">
  <link rel="stylesheet" href="responsif.css">
</head>
<body>

  <header id="beranda">
    <div class="header-baris">
      <h1></h1>
      <label for="tema" class="tombol-tema">
        <input type="checkbox" id="tema" class="pengalih-tema">
        Tema gelap
      </label>
      <nav aria-label="Navigasi utama">
        <ul>
          <li><a href="#beranda">Beranda</a></li>
          <li><a href="#daftar-tugas">Daftar Tugas</a></li>
          <li><a href="#kontak">Kontak</a></li>
        </ul>
      </nav>
    </div>
    <p>Halaman ini menampilkan Tugas Kuliah dan Tenggatnya.</p>
  </header>

  <main>
    <aside class="sisi">
      <h2>Tambah Tugas</h2>
      <form id="form-tugas" action="/simpan" method="post" novalidate>
        <p class="form-kolom">
          <label for="nama-tugas">Nama Tugas</label>
          <input type="text" id="nama-tugas" name="nama-tugas" required>
          <span class="pesan-galat">Nama tugas wajib diisi.</span>
        </p>
        <p class="form-kolom">
          <label for="tenggat">Tenggat</label>
          <input type="date" id="tenggat" name="tenggat" required>
          <span class="pesan-galat">Tenggat wajib diisi.</span>
        </p>
        <p class="form-kolom">
          <label for="nama-mata-kuliah">Nama Mata Kuliah</label>
          <input type="text" id="nama-mata-kuliah" name="nama-mata-kuliah" required>
          <span class="pesan-galat">Nama mata kuliah wajib diisi.</span>
        </p>
        <button type="submit" id="tombol-simpan" disabled>Simpan</button>
      </form>
    </aside>

    <section id="daftar-tugas" class="utama">
      <h2>Daftar Tugas Saya</h2>

      <div id="filter">
        <button type="button" data-kategori="semua" class="aktif">Semua</button>
        <button type="button" data-kategori="PABW">PABW</button>
        <button type="button" data-kategori="Basis Data">Basis Data</button>
        <button type="button" data-kategori="Rekayasa Perangkat Lunak">RPL</button>
        <button type="button" data-kategori="Sains Data">Sains Data</button>
      </div>

      <ul id="daftar" class="galeri"></ul>

      <p id="pesan-kosong" hidden>Tidak ada tugas pada kategori itu.</p>

      <figure>
        <img src="Tugas%231.jpg" alt="Gambar pendukung untuk Tugas #1 kuliah." width="640" height="360" loading="lazy">
        <figcaption>Dokumentasi Tugas #1 kuliah.</figcaption>
      </figure>
    </section>

  </main>

  <footer id="kontak">
    <p></p>
  </footer>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/dom.js"></script>
</body>
</html>
